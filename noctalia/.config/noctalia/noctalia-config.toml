type = "andrewdems/vpn-manager:bar"

[widget.battery]
display_mode = "graphic"
type = "battery"

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.clock]
format = "{:%H:%M - %d/%m}"
type = "clock"

[widget.control-center]
custom_image_colorize = true
glyph = "niri"
type = "control-center"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.input_volume]
device = "input"
type = "volume"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.launcher]
glyph = "brand-apple-filled"
scale = 1.25
type = "launcher"

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 32.0
hide_when_no_media = true
max_length = 220.0
min_length = 80.0
scale = 1.0
title_scroll = "on_hover"
type = "media"

[widget.mirror]
type = "elijaharch/wl-screen-mirror:mirror"

[widget.network]
show_label = false
type = "network"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.ocr]
type = "fel/ocr:ocr"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.spacer]
type = "spacer"

[widget.spacer_2]
length = 8
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.status]
enable_scroll = false
show_counts = false
type = "davemhammer/tailscale:status"

[widget.taskbar]
group_by_workspace = true
scale = 1.1500000000000001
type = "taskbar"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"

[widget.tray]
drawer = true
type = "tray"

[widget.volume]
mute_color = "on_surface_variant"

[widget.widget]
type = "oldirtty/color_picker:widget"
